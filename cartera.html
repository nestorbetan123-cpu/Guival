   Datos: base nueva (Supabase, funciones cartera_*). Novedad: el RECIBO es el grupo: un recibo puede tener varias
   facturas y varias formas de pago (efectivo, cheque, transferencia, consignación); debe cuadrar para cerrar. */
const $app = document.getElementById('app');
const PANTALLAS = {};
const state = {};
let NIVEL = 0;
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const barra = () => '';

function aviso(msg, error) {
  const t = document.getElementById('toast'); t.textContent = msg; t.style.background = error ? '#b42318' : '#006634'; t.style.display = 'block';
  clearTimeout(aviso.t); aviso.t = setTimeout(() => t.style.display = 'none', error ? 6000 : 3000);
}
async function api(accion, req) {
  accion = String(accion).replace(/^recibo\./, ''); req = req || {};
  const R = (fn, b) => GuivalSB.rpc(fn, b).catch(e => { throw new Error(/SIN_SESION/.test(e.message) ? 'Su sesión venció. Salga de la app y vuelva a entrar con Google.' : e.message); });
  const C = window.__conv;
  switch (accion) {
    case 'inicio': {
      const u = await R('cartera_inicio');
      if (!u) throw new Error('Su usuario no tiene acceso al Informe de Cartera. Pídaselo a Nestor.');
      NIVEL = u.nivel || 0; const p = String(u.hoy).split('/'); u.hoyIso = p[2] + '-' + p[1] + '-' + p[0]; u.impresora = false;
      if (!u.elige) { const v = u.vendedores[0].vendedor; u.lista = await R('cartera_lista', { v }) || []; u.tal = await R('cartera_tal_de', { v }); }
      return u;
    }
    case 'tal_de': return R('cartera_tal_de', { v: req.vendedor });
    case 'talonarios': return R('cartera_talonarios');
    case 'tal_guardar': return R('cartera_tal_guardar', { t: req.t });
    case 'tal_reasignar': return R('cartera_tal_reasignar', { p_id: req.id, p_vendedor: req.vendedor });
    case 'tal_eliminar': return R('cartera_tal_eliminar', { p_id: req.id });
    case 'pendientes': return (await R('cartera_pendientes')) || [];
    case 'lista': return (await R('cartera_lista', { v: req.vendedor })) || [];
    case 'informe': { const r = await R('cartera_informe', { p_id: req.id }); if (!r) throw new Error('No encontré el informe'); return C.aLineas(r); }
    case 'reabrir': return C.aLineas(await R('cartera_reabrir', { p_id: req.id }));
    case 'recibir': return C.aLineas(await R('cartera_recibir', { p_id: req.id, si: req.si !== false }));
    case 'buscar': return (await R('cartera_buscar', { q: req.q })) || [];
    case 'facturas': return (await R('cartera_facturas', { p_cod: req.cod, p_id: req.id || null })) || [];
    case 'guardar': case 'cerrar': return R('cartera_guardar', { inf: C.aRecibos(req.inf), p_ver: req.ver || null, cerrar: accion === 'cerrar', por: POR });
    case 'config': return R('cartera_config_guardar', { p_tarifa: Number(String(req.config.tarifa).replace(',', '.')), p_minimo: Number(String(req.config.minimo).replace(/[^\d]/g, '')) });
  }
  throw new Error('Acción desconocida');
}

<script>


function mcInformeImpreso_(inf, V, calc, usada) {
  const E = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const mil = n => Math.abs(Math.round(n || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const n0 = n => n ? (n < 0 ? '-' : '') + mil(n) : '';
  const $p = n => (n < 0 ? '-' : '') + '$ ' + mil(n);
  const TIPO = { 'Factura completa': 'FC', 'Contado': 'Con', 'Abono': 'A', 'Saldo': 'S' };
  const FORMA = { 'Efectivo': 'Efect', 'Cheque': 'Cheq', 'Transferencia': 'Trans', 'Consignación': 'Consig' };
  const corto = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
  const lin = (inf.lineas || []).filter(usada);
  const C = lin.map(l => calc(l));
  const t = { f: 0, rf: 0, ri: 0, ica: 0, dev: 0, dcto: 0 }, pf = { Efectivo: [0, 0], Cheque: [0, 0], Transferencia: [0, 0], 'Consignación': [0, 0] };
  const kR = l => String(l.recibo || '').trim().toUpperCase(), sumR = {};
  lin.forEach((l, k) => { if (!l.anulado) sumR[kR(l)] = (sumR[kR(l)] || 0) + C[k].rec; });
  const PG = {}; Object.keys(sumR).forEach(k => { const ps = (inf.pagos || {})[k] || [];
    PG[k] = ps.length === 1 && (ps[0].valor === '' || ps[0].valor == null) ? [Object.assign({}, ps[0], { valor: sumR[k] })] : ps.map(p => Object.assign({}, p, { valor: Number(String(p.valor).replace(/[^\d\-]/g, '')) || 0 })); });
  Object.keys(PG).forEach(k => PG[k].forEach(p => { if (pf[p.forma]) { pf[p.forma][0] += p.valor; pf[p.forma][1]++; } }));
  let contado = 0;
  const vistas = {};   
  lin.forEach((l, k) => { if (l.anulado) return; const c = C[k];
    Object.keys(t).forEach(x => { if (x !== 'f') t[x] += c[x]; });
    const kf = l.cod + '|' + String(l.factura || '').trim().toUpperCase(); if (!l.factura || !vistas[kf]) { t.f += c.f; vistas[kf] = 1; }
    if (l.tipo === 'Contado') contado++; });
  
  const DED = [['rf', 'Ret. Fte.', 'Ret. Fte.'], ['ri', 'Ret. IVA', 'Ret. IVA'], ['ica', 'ICA', 'ICA'], ['dev', 'Devol.', 'Devoluciones'], ['dcto', 'Dcto.', 'Descuentos']]
    .filter(d => C.some(c => c[d[0]]));
  const total = pf.Efectivo[0] + pf.Cheque[0] + pf.Transferencia[0] + pf['Consignación'][0];
  const yaR = {};
  
  const largo = Math.max(20, 40 - 3 * DED.length);
  const yaVista = {};   
  const letra = /norma|^n$/i.test(String(inf.empresa || '')) ? 'N' : 'G';
  const filas = lin.map((l, k) => {
    const c = C[k];
    if (l.anulado) return `<tr><td class="cod"></td><td class="cli"><b>ANULADO</b></td><td></td><td></td><td class="cod">${E(l.recibo)}</td><td class="m"></td>${DED.map(() => '<td class="m"></td>').join('')}<td class="m"></td><td></td></tr>`;
    const kf = l.cod + '|' + String(l.factura || '').trim().toUpperCase(), primera = !l.factura || !yaVista[kf]; yaVista[kf] = 1;
    return `<tr${l.tipo === 'Contado' ? ' class="con"' : ''}><td class="cod">${E(l.cod)}</td><td class="cli">${E(corto(l.nombre, largo))}</td><td>${E(l.factura)}</td><td>${TIPO[l.tipo] || E(l.tipo)}</td><td class="cod">${E(l.recibo)}</td>` +
      `<td class="m">${primera ? n0(c.f) : ''}</td>${DED.map(d => `<td class="m">${n0(c[d[0]])}</td>`).join('')}<td class="m b">${n0(c.rec)}</td><td>${yaR[kR(l)] ? '' : (yaR[kR(l)] = 1, [...new Set((PG[kR(l)] || []).map(p => FORMA[p.forma] || E(p.forma)))].join('+'))}</td></tr>`;
  }).join('');
  const caja = (titulo, valor, cls) => `<td${cls ? ' class="' + cls + '"' : ''}><span>${titulo}</span><b>${valor}</b></td>`;
  return `<div class="inf">
    <table class="enc"><tr><td><h1>INFORME DE CARTERA · RECIBOS ${letra}</h1></td><td class="der"><b>Del</b> ${E(inf.inicio)} <b>al</b> ${E(inf.cierre || '—')}</td></tr>
      <tr><td><b>Vendedor:</b> ${E(inf.vendedor)} &nbsp; <b>Código:</b> ${E(V.codigo)} &nbsp; <b>Zona:</b> ${E(V.zona)}</td><td class="der peq">Informe ${E(inf.id)}</td></tr></table>
    <table class="d"><thead><tr><th>Código</th><th>Cliente</th><th>Factura</th><th>Tipo</th><th>Recibo</th><th>Vr. factura</th>${DED.map(d => `<th>${d[1]}</th>`).join('')}<th>Vr. recibido</th><th>Forma</th></tr></thead>
      <tbody>${filas}</tbody></table>
    <table class="tot"><tr>${caja('Vr. facturas', $p(t.f))}${DED.map(d => caja(d[2], $p(t[d[0]]))).join('')}</tr></table>
    <table class="tot"><tr>${caja('Efectivo', $p(pf.Efectivo[0]))}${caja('Cheques (' + pf.Cheque[1] + ')', $p(pf.Cheque[0]))}${caja('Transferencias (' + pf.Transferencia[1] + ')', $p(pf.Transferencia[0]))}${pf['Consignación'][1] ? caja('Consignaciones (' + pf['Consignación'][1] + ')', $p(pf['Consignación'][0])) : ''}${caja('TOTAL RECIBO', $p(total), 'gran')}</tr></table>
    ${(() => { const det = Object.keys(PG).filter(k => PG[k].length > 1 || PG[k].some(p => p.banco || p.ref || p.forma !== 'Efectivo'));
      return det.length ? `<table class="d" style="margin-top:5px"><thead><tr><th>Recibo</th><th>Forma de pago</th><th>Banco</th><th>Comprobante</th><th>Valor</th></tr></thead><tbody>${det.map(k => PG[k].map(p => `<tr><td class="cod">${E(k)}</td><td>${E(p.forma)}</td><td>${E(p.banco)}</td><td>${E(p.ref)}</td><td class="m">${n0(p.valor)}</td></tr>`).join('')).join('')}</tbody></table>` : ''; })()}
    <p class="obs"><b>Observaciones:</b> ${E(inf.obs || '')}</p>
    <table class="fir"><tr><td><span>Firma vendedor</span></td><td><span>Recibido por (Cartera)</span></td><td><span>${contado ? 'Vo.Bo. Gerencia – descuentos de contado (' + contado + ')' : 'Fecha de entrega'}</span></td></tr></table>
  </div>`;
}

  const nuevo = vend => ({ id: U.hoyIso.replace(/-/g, '') + '-' + Math.random().toString(36).slice(2, 7).toUpperCase(), estado: 'NUEVO', inicio: U.hoy, cierre: '',
    empresa: 'G', vendedor: vend, obs: '', lineas: [vacia()], pagos: {}, ver: 0 });
  const LSK = () => 'guival_recibo_' + (st ? st.vendedor : '');

  /** FC, Contado y Saldo: si no escribe el valor pagado se calcula; con la casilla Descuento, el descuento sale de lo pagado
   *  (o lo pagado del descuento). Abono: solo lo que escriba. Solo cuentan los valores con su casilla marcada. */
  function calc(l) {
    if (l.anulado) return { f: 0, rf: 0, ri: 0, ica: 0, dev: 0, dcto: 0, rec: 0, cuadra: true, neg: false, ref: 0 };
    const v = k => chk(l, k) ? num(l[k]) : 0;
    const f = num(l.vf), rf = v('rf'), ri = v('ri'), ica = v('ica'), dev = v('dev'), ded = rf + ri + ica + dev;
    const ref = (l.tipo === 'Saldo' && !vac(l.saldo)) ? num(l.saldo) : f;
    const auto = (l.tipo === 'Factura completa' || l.tipo === 'Contado' || l.tipo === 'Saldo') && ref > 0;
    const conD = chk(l, 'dcto');
    let dcto = 0, rec, cuadra = true;
    if (!auto) { dcto = conD ? num(l.dcto) : 0; rec = num(l.pag); }
    else if (conD) {
      dcto = !vac(l.dcto) ? num(l.dcto) : (!vac(l.pag) ? ref - ded - num(l.pag) : 0);
      rec = !vac(l.pag) ? num(l.pag) : ref - ded - dcto;
      if (!vac(l.dcto) && !vac(l.pag) && Math.abs(ref - ded - num(l.dcto) - num(l.pag)) > 1) cuadra = false;
    } else {
      rec = !vac(l.pag) ? num(l.pag) : ref - ded;
      if (!vac(l.pag) && Math.abs(ref - ded - num(l.pag)) > 1) cuadra = false;
    }
    return { f, rf, ri, ica, dev, dcto, rec, cuadra, neg: dcto < 0 || rec < 0, ref, auto };
  }
  /* ----- recibos: varias facturas y varias formas de pago ----- */
  const kRec = r => String(r || '').trim().toUpperCase();
  const recibosDe = lns => { const o = []; lns.forEach(l => { const k = kRec(l.recibo); if (k && !o.includes(k)) o.push(k); }); return o; };
  const sumaRecibo = k => st.lineas.filter(l => kRec(l.recibo) === k && !l.anulado && usada(l)).reduce((a, l) => a + calc(l).rec, 0);
  const reciboAnulado = k => st.lineas.some(l => kRec(l.recibo) === k && l.anulado);
  /** Formas de pago de un recibo; si hay una sola sin valor, vale lo de las facturas. */
  function pagosDe(k) {
    const ps = (st.pagos && st.pagos[k]) || [];
    if (ps.length === 1 && vac(ps[0].valor)) return [Object.assign({}, ps[0], { valor: sumaRecibo(k), auto: true })];
    return ps.map(p => Object.assign({}, p, { valor: num(p.valor) }));
  }
  function cuadreRecibo(k) {
    const f = sumaRecibo(k), ps = pagosDe(k), p = ps.reduce((a, x) => a + x.valor, 0);
    return { f, p, dif: p - f, ok: Math.abs(p - f) <= 1 && ps.length > 0 && ps.every(x => x.forma), sinForma: !ps.length || ps.some(x => !x.forma) };
  }
  window.__conv = {
    aLineas(inf) {
      if (!inf) return inf;
      const lineas = [], pagos = {};
      (inf.recibos || []).forEach(r => {
        const k = kRec(r.recibo);
        if (r.anulado) lineas.push(Object.assign(vacia(r.recibo), { anulado: true }));
        else (r.facturas || []).forEach(f => { const o = Object.assign({}, f); delete o.c; o.recibo = r.recibo; lineas.push(o); });
        if (k && (r.pagos || []).length) pagos[k] = r.pagos.map(p => ({ forma: p.forma || '', valor: p.valor == null ? '' : String(p.valor), banco: p.banco || '', ref: p.ref || p.referencia || '' }));
      });
      return Object.assign({}, inf, { lineas, pagos });
    },
    aRecibos(s) {
      const orden = [], g = {};
      (s.lineas || []).filter(usada).forEach(l => {
        const k = kRec(l.recibo); let r = g[k];
        if (!r) { r = g[k] = { recibo: k, anulado: false, facturas: [], pagos: [] }; orden.push(r); }
        if (l.anulado) { r.anulado = true; return; }
        const c = calc(l), f = Object.assign({}, l); delete f.recibo; delete f.forma;
        f.c = { f: c.f, rf: c.rf, ri: c.ri, ica: c.ica, dev: c.dev, dcto: c.dcto, rec: c.rec, base: chk(l, 'rf') ? (l.facSistema ? num(l.fsin) : num(l.base)) : '' };
        r.facturas.push(f);
      });
      orden.forEach(r => { if (!r.anulado) r.pagos = pagosDe(r.recibo).map(p => ({ forma: p.forma, valor: Math.round(p.valor), banco: p.banco || '', ref: p.ref || '' })); });
      return { id: s.id, vendedor: s.vendedor, empresa: s.empresa, obs: s.obs, inicio: s.inicio, recibos: orden };
    }
  };
  /** Lo ya pagado de esta factura en otros informes y en los otros pagos de este informe. */
  function previo(i) {
    const l = st.lineas[i], fu = String(l.factura || '').trim().toUpperCase(), p = { rec: 0, rf: 0, ri: 0, ica: 0, dev: 0, dcto: 0 };
    if (!fu || !l.cod) return p;
    const fi = (FACTS[l.cod] || []).find(f => f.doc === fu);
    if (fi && fi.prev) Object.keys(p).forEach(k => p[k] += num(fi.prev[k]));
    st.lineas.forEach((o, j) => { if (j >= i || o.anulado || o.cod !== l.cod || String(o.factura || '').trim().toUpperCase() !== fu) return;
      const c = calc(o); Object.keys(p).forEach(k => p[k] += c[k]); });
    p.total = p.rec + p.rf + p.ri + p.ica + p.dev + p.dcto;
    return p;
  }
  /** Retención de IVA sugerida: 15 % del IVA de la factura (ya ajustada por notas), menos lo retenido antes. */
  function reteIva(l, i) {
    const vf = num(l.vf); let iva = null;
    if (l.facSistema && vf) iva = vf - num(l.fsin); else if (!vac(l.base) && vf) iva = vf - num(l.base);
    if (iva == null || iva <= 0) return null;
    const antes = previo(i).ri;
    return { iva, total: Math.round(iva * PCT_RETEIVA / 100), antes, sug: Math.max(0, Math.round(iva * PCT_RETEIVA / 100) - antes) };
  }
  /** Retención sugerida: base sin IVA × tarifa. Solo Guival/Lince y si la base llega al mínimo. */
  function retencion(l) {
    const emp = (l.facSistema && l.femp) ? l.femp : st.empresa;
    if (/norma|^n$/i.test(emp)) return { error: 'Las facturas N no llevan retención en la fuente.' };
    if (l.facSistema && !/guival|lince/i.test(emp)) return { error: 'Solo aplica a facturas de Guival o Lince.' };
    const base = l.facSistema ? l.fsin : num(l.base);
    if (!base) return { pideBase: true };
    if (base < U.config.minimo) return { error: 'La base sin IVA (' + $f(base) + ') es menor al mínimo de ' + $f(U.config.minimo) + ': no aplica retención.', base };
    const i = st.lineas.indexOf(l), antes = i >= 0 ? previo(i).rf : 0;
    const r = { base, antes, total: Math.max(0, Math.round(base * U.config.tarifa / 100) - antes) };
    if (parcial(l) && l.facSistema && num(l.vf) && !vac(l.pag)) r.pago = Math.round(num(l.pag) * (num(l.fsin) / num(l.vf)) * U.config.tarifa / 100);
    return r;
  }

          <div class="sub">Informe del ${esc(x.inicio)} · ${x.pagos} pago${x.pagos === 1 ? '' : 's'} · Total recibo ${$f(x.total)}</div>

  function cargar(vend, abierto, letra) {

    if (!abierto && letra) { st.empresa = letra; st.lineas[0].recibo = siguienteRecibo(vend, letra); }
    st.empresa = letraDe(st);
    // informes de antes de las casillas: queda marcada la casilla de cada valor que ya estaba lleno
    st.lineas = (st.lineas || []).map(l => { const o = Object.assign({}, l);
      [['conRet', 'rf'], ['conRi', 'ri'], ['conIca', 'ica'], ['conDev', 'dev'], ['conDcto', 'dcto']].forEach(([c, k]) => { if (o[c] === undefined) o[c] = !vac(o[k]); });
      return Object.assign(vacia(), o); });
    if (!st.lineas.length) st.lineas.push(vacia());
    if (!abierto) { try { const g = JSON.parse(localStorage.getItem(LSK()) || 'null'); if (g && g.estado === 'NUEVO' && g.vendedor === vend && g.lineas.some(usada)) st = g; } catch (e) {} }

  function cambio() {
    if (soloVer()) return;

    marcar('Cambios sin guardar…'); clearTimeout(timer); timer = setTimeout(guardarYa, 2000);
  }
  async function guardarYa() {
    clearTimeout(timer);
    if (!st || soloVer()) return;
    const firma = JSON.stringify(st.lineas) + JSON.stringify(st.pagos) + st.obs + st.empresa;
    if (firma === ultimo) return;
    if (st.estado === 'NUEVO' && !st.lineas.some(usada) && !st.obs) return;
    if (guardando) { pendiente = true; return; }
    guardando = true; marcar('Guardando…');
    try {
      const r = await api('recibo.guardar', { inf: st, ver: st.ver });
      st.ver = r.ver; st.estado = r.estado; st.inicio = r.inicio; ultimo = firma;
      marcar('✔ Guardado ' + new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }));
    } catch (e) {
      if (e.message === 'CAMBIO_EN_OTRO_EQUIPO') { marcar('⚠ Este informe se cambió en otro equipo.'); if (confirm('Este informe se modificó en otro equipo. ¿Cargar la versión guardada? (lo último de esta pantalla se pierde)')) return elegirOVolver(); }
      else if (/cerrado|recibi/.test(e.message)) { aviso(e.message, true); return elegirOVolver(); }
      else marcar('⚠ Sin conexión: se reintenta solo'), timer = setTimeout(guardarYa, 15000);
    } finally { guardando = false; if (pendiente) { pendiente = false; guardarYa(); } }
  }

  function marcar(txt) { const e = document.getElementById('rc-est'); if (e) e.textContent = txt; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') guardarYa(); });

   
  function pintar() {

    const sig = u ? u + 1 : ls[0].desde, t = ls.find(x => sig >= x.desde && sig <= x.hasta) || ls.find(x => x.desde > sig) || ls[0];

  const ultimoRecibo = i => { for (let j = i - 1; j >= 0; j--) if (digitos(st.lineas[j].recibo)) return String(st.lineas[j].recibo).trim(); return ''; };
  /** Completa el recibo: con los 3 últimos dígitos busca el número en sus talonarios; con el número completo revisa que sea suyo. */

    if (d.length <= 3) {

  const campoNum = (l, c, tt, lv, extra) => `<div><label>${tt}</label><input class="num" data-c="${c}" inputmode="numeric" value="${vac(l[c]) ? '' : num(l[c]).toLocaleString('es-CO')}" ${lv ? 'readonly' : ''}>${extra || ''}</div>`;

    let info = '';
    if (r.error) info = `<div class="ina" style="margin-top:6px">${esc(r.error)}</div>`;
    else if (r.pideBase) info = '<div class="sub">Escriba la base sin IVA para calcularla, o escriba abajo el valor que se descontó el cliente.</div>';
    else info = `<div class="sub"><b>Retención en la fuente</b> · base ${$f(r.base)} × ${String(U.config.tarifa).replace('.', ',')}%${r.antes ? ' · ya retenido antes ' + $f(r.antes) : ''}</div><div class="sug">
      <button data-s="total">${r.antes ? 'Lo que falta' : 'Sobre la factura'}: ${$f(r.total)}</button>${r.pago != null ? `<button data-s="pago">Sobre este pago: ${$f(r.pago)}</button>` : ''}</div>`;
    box.innerHTML = base + info + `<div style="margin-top:6px"><label>Retención en la fuente descontada</label><input class="num" data-r="rf" inputmode="numeric" value="${vac(l.rf) ? '' : num(l.rf).toLocaleString('es-CO')}" ${lv ? 'readonly' : ''}></div>`;
    if (lv) return;
    box.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { sugerirRet(i, b.dataset.s); refrescar(i); cambio(); });
    box.querySelectorAll('[data-r]').forEach(inp => {
      inp.oninput = () => { l[inp.dataset.r] = inp.value.replace(/[^\d]/g, ''); if (inp.dataset.r === 'base') { l.rf = ''; } recalc(i); cambio(); };
      inp.onblur = () => { const k = inp.dataset.r; inp.value = vac(l[k]) ? '' : num(l[k]).toLocaleString('es-CO'); if (k === 'base') { if (vac(l.rf)) sugerirRet(i, 'total'); refrescar(i); } };
    });
  }

  function recalc(i) {   // actualiza números y avisos sin repintar los campos
    const el = document.querySelector(`.rc .ln[data-i="${i}"]`); if (!el) return;
    const l = st.lineas[i];
    el.querySelector('[data-o=recav]').textContent = avisoRecibo(i);
    if (l.anulado) { el.querySelector('[data-o=av]').innerHTML = l.recibo ? '' : 'Escriba el número del recibo anulado.'; return totales(); }
    // saldo de la factura = valor de referencia − lo pagado antes (otros informes y otros pagos de este)
    const fu = String(l.factura || '').trim().toUpperCase(), fi = (FACTS[l.cod] || []).find(f => f.doc === fu), p = previo(i);
    if (l.tipo === 'Saldo') l.saldo = vac(l.vf) ? '' : String(Math.max(0, num(l.vf) - p.total));
    const c = calc(l), av = [];
    el.querySelector('[data-o=dcto]').textContent = chk(l, 'dcto') && (c.dcto || !vac(l.dcto)) ? $f(c.dcto) : '—';
    el.querySelector('[data-o=rec]').textContent = usada(l) ? $f(c.rec) : '—';
    if (usada(l) && !l.tipo) av.push('Escoja el tipo de pago.');
    if (!c.cuadra) av.push(chk(l, 'dcto') ? 'El descuento y el valor pagado no cuadran con la factura. Revise los valores.'
      : 'El valor pagado no cuadra con ' + (l.tipo === 'Saldo' ? 'el saldo' : 'la factura') + ' (' + $f(c.ref) + ' menos lo descontado). Marque Descuento si el cliente se descontó algo, o cambie el tipo a Abono.');
    if (c.neg) av.push('Un valor da negativo: revise.');
    if (l.tipo === 'Abono' && usada(l) && vac(l.pag)) av.push('Escriba el valor pagado.');
    if (fu && st.lineas.some((o, j) => j !== i && !o.anulado && String(o.factura || '').trim().toUpperCase() === fu && o.cod === l.cod && !parcial(o) && !parcial(l))) av.push('Esta factura ya está en otro pago de este informe.');
    el.querySelector('[data-o=av]').innerHTML = av.map(esc).join('<br>');
    ['dcto', 'pag'].forEach(x => { const f = el.querySelector(`[data-c=${x}]`); if (f) f.classList.toggle('mal', !c.cuadra); });
    el.querySelector('[data-c=tipo]').classList.toggle('mal', !!(usada(l) && !l.tipo));
    el.querySelector('[data-o=tipo]').innerHTML = l.tipo === 'Contado' ? 'El descuento de contado lo autoriza la gerencia con su firma en el informe impreso.' :
      l.tipo === 'Abono' ? 'Abono: escriba lo que pagó. El descuento solo si marca la casilla.' :
      l.tipo === 'Saldo' ? (vac(l.saldo) ? '' : 'Saldo pendiente de la factura: <b>' + $f(num(l.saldo)) + '</b>' + (p.total ? ' (ya se reportaron ' + $f(p.total) + ')' : '')) : '';
    el.querySelector('[data-o=finfo]').innerHTML = fi ? infoFac(fi) : (fu && l.cod && FACTS[l.cod] ? 'Factura digitada a mano (no está entre las recientes del cliente)' : '');
    pintarAjuste(el, i, fi);
    const rs = el.querySelector('[data-o=risug]');
    if (rs) { const r = reteIva(l, i); rs.innerHTML = r ? `<button data-ri="${r.sug}">15% del IVA (${$f(r.iva)})${r.antes ? ' menos lo ya retenido' : ''}: ${$f(r.sug)}</button>` : '<span class="sub">Sin IVA de referencia: escriba lo que retuvo el cliente.</span>';
      const b = rs.querySelector('[data-ri]'); if (b && !soloVer()) b.onclick = () => { l.ri = b.dataset.ri; el.querySelector('[data-c=ri]').value = num(l.ri).toLocaleString('es-CO'); recalc(i); cambio(); }; }
    cuadre(kRec(l.recibo));
    totales();
  }
   
  function pintarAjuste(el, i, fi) {
    const box = el.querySelector('[data-o=aj]'), l = st.lineas[i];
    if (!box) return;
    if (!fi || !l.facSistema || !(fi.notas && fi.notas.length)) { box.innerHTML = ''; return; }
    const ns = fi.notas, sN = ns.reduce((a, n) => a + n.sin, 0), tN = ns.reduce((a, n) => a + n.total, 0);
    const base = fi.sin - sN, tot = fi.total - tN, iva = tot - base, ivaF = fi.total - fi.sin;
    const usa = num(l.vf) === tot ? 'sug' : num(l.vf) === fi.total ? 'ori' : 'otro';
    box.innerHTML = `<div class="aj"><b>Documentos relacionados con esta factura</b>
      <table><tr><td></td><td>Base</td><td>IVA</td><td>Total</td></tr>
      <tr><td>Factura ${esc(fi.doc)}</td><td>${$f(fi.sin)}</td><td>${$f(ivaF)}</td><td>${$f(fi.total)}</td></tr>
      ${ns.map(n => `<tr><td>− ${esc(n.doc)} ${n.fecha ? '<small>' + fCorta(n.fecha) + '</small>' : ''}</td><td>${$f(n.sin)}</td><td>${$f(n.total - n.sin)}</td><td>${$f(n.total)}</td></tr>`).join('')}
      <tr class="s"><td>Nuevo valor sugerido</td><td>${$f(base)}</td><td>${$f(iva)}</td><td>${$f(tot)}</td></tr></table>
      ${soloVer() ? '' : `<div class="sug"><button data-aj="sug" ${usa === 'sug' ? 'style="background:var(--brand);color:#fff"' : ''}>Usar el sugerido ${$f(tot)}</button><button data-aj="ori" ${usa === 'ori' ? 'style="background:var(--brand);color:#fff"' : ''}>Usar el de la factura ${$f(fi.total)}</button></div>
      <div class="sub">O escriba otro valor en "Vr. factura". Ese queda como referencia para los cálculos.</div>`}</div>`;
    box.querySelectorAll('[data-aj]').forEach(b => b.onclick = () => {
      const s = b.dataset.aj === 'sug';
      Object.assign(l, { vf: String(s ? tot : fi.total), fsin: s ? base : fi.sin, ftotal: s ? tot : fi.total });
      el.querySelector('[data-c=vf]').value = num(l.vf).toLocaleString('es-CO');
      if (chk(l, 'rf')) { l.rf = ''; sugerirRet(i, 'total'); }
      if (chk(l, 'ri')) { const r = reteIva(l, i); l.ri = r ? String(r.sug) : l.ri; }
      pintarLinea(i); cambio();
    });
  }
  function refrescar(i) { const el = document.querySelector(`.rc .ln[data-i="${i}"]`); if (!el) return; pintarRet(el, i); recalc(i); }

  function sumas() {
    const t = { rf: 0, ri: 0, ica: 0, dev: 0, dcto: 0, ef: 0, ch: 0, nch: 0, tr: 0, ntr: 0, co: 0, nco: 0 };
    st.lineas.forEach(l => { if (!usada(l) || l.anulado) return; const c = calc(l); t.rf += c.rf; t.ri += c.ri; t.ica += c.ica; t.dev += c.dev; t.dcto += c.dcto; });
    recibosDe(st.lineas.filter(l => usada(l) && !l.anulado)).forEach(k => pagosDe(k).forEach(p => {
      if (p.forma === 'Efectivo') t.ef += p.valor; if (p.forma === 'Cheque') { t.ch += p.valor; t.nch++; }
      if (p.forma === 'Transferencia') { t.tr += p.valor; t.ntr++; } if (p.forma === 'Consignación') { t.co += p.valor; t.nco++; } }));
    t.total = t.ef + t.ch + t.tr + t.co; return t;
  }
  function totales() {
    const box = document.getElementById('rc-tot'); if (!box) return;
    const t = sumas();
    box.innerHTML = `<table class="tt"><tr class="sec"><td colspan="2">DESCUENTOS DEL CLIENTE</td></tr>
      <tr><td>Retención en la fuente</td><td>${$f(t.rf)}</td></tr><tr><td>Retención de IVA</td><td>${$f(t.ri)}</td></tr><tr><td>ICA</td><td>${$f(t.ica)}</td></tr>
      <tr><td>Devoluciones</td><td>${$f(t.dev)}</td></tr><tr><td>Descuentos</td><td>${$f(t.dcto)}</td></tr>${st.lineas.some(l => l.anulado) ? `<tr><td>Recibos anulados</td><td>${st.lineas.filter(l => l.anulado).length}</td></tr>` : ''}
      <tr class="sec"><td colspan="2">RECIBIDO</td></tr>
      <tr><td>Efectivo</td><td>${$f(t.ef)}</td></tr><tr><td>Cheques (${t.nch})</td><td>${$f(t.ch)}</td></tr><tr><td>Transferencias (${t.ntr})</td><td>${$f(t.tr)}</td></tr>${t.nco ? `<tr><td>Consignaciones (${t.nco})</td><td>${$f(t.co)}</td></tr>` : ''}
      <tr class="tot"><td>TOTAL RECIBO</td><td>${$f(t.total)}</td></tr></table>`;
  }
  const infoFac = f => { const d = dias(f.fecha);
    return `${esc(empLabel(f.emp))} · ${fCorta(f.fecha)} · <span style="color:${d > 45 ? '#b42318' : 'inherit'}">${hace(d)}</span> · ${$f(f.total)}` +
      (f.abonado ? ` · <b>pagado antes ${$f(f.abonado)}</b>` : '') +
      (f.pagos && f.pagos.length ? `<br><span class="ina">Ya reportada: ${esc(f.pagos.join(' · '))}</span>` : ''); };

  /* ---------------- cliente y facturas ---------------- */
  const cargarFacturas = cod => FACTS[cod] ? Promise.resolve(FACTS[cod]) : api('recibo.facturas', { cod, id: st.id }).then(r => FACTS[cod] = r || []).catch(e => { aviso(e.message, true); return []; });
  function aplicarCliente(el, i, c) {
    const l = st.lineas[i]; Object.assign(l, { cod: c.cod, nombre: c.nombre, ciudad: c.ciudad, inactivo: c.inactivo, factura: '', facSistema: false, fsin: 0, femp: '', ftotal: 0 });
    el.querySelector('[data-c=cod]').value = c.cod; el.querySelector('[data-c=nombre]').value = c.nombre; el.querySelector('[data-c=factura]').value = '';
    el.querySelector('[data-o=ciu]').innerHTML = esc(c.ciudad) + (c.inactivo ? ' · <span class="ina">cliente inactivo</span>' : '');
    el.querySelector('[data-c=factura]').placeholder = 'Toque para ver facturas';
    cargarFacturas(c.cod).then(() => refrescar(i)); refrescar(i); cambio();
  }
  function buscador(el, inp, i) {
    const ls = inp.parentElement.querySelector('.ls'); let t = null, seq = 0, res = [];
    const cerrar = () => ls.style.display = 'none';
    const mostrar = () => { ls.innerHTML = res.length ? res.map((c, j) => `<div data-j="${j}"><b>${esc(c.cod)}</b> · ${esc(c.nombre)}<br><small>${esc(c.ciudad)}</small>${c.inactivo ? ' <span class="ina">inactivo</span>' : ''}</div>`).join('') : '<div><small>Sin resultados</small></div>';
      ls.style.display = 'block'; ls.querySelectorAll('[data-j]').forEach(d => d.addEventListener('mousedown', ev => { ev.preventDefault(); aplicarCliente(el, i, res[+d.dataset.j]); cerrar(); el.querySelector('[data-c=factura]').focus(); })); };
    inp.addEventListener('input', () => {
      Object.assign(st.lineas[i], { nombre: inp.value, cod: '', ciudad: '', factura: '', facSistema: false });
      el.querySelector('[data-c=cod]').value = ''; el.querySelector('[data-o=ciu]').textContent = '';
      clearTimeout(t); const q = inp.value.trim(); if (q.length < 2) return cerrar();
      t = setTimeout(() => { const my = ++seq; ls.innerHTML = '<div><small>Buscando…</small></div>'; ls.style.display = 'block';
        api('recibo.buscar', { q }).then(r => { if (my === seq) { res = r; mostrar(); } }).catch(e => ls.innerHTML = '<div><small>' + esc(e.message) + '</small></div>'); }, 350);
    });
    inp.addEventListener('blur', () => setTimeout(cerrar, 150));
  }
  function selFactura(el, inp, i) {
    const ls = inp.parentElement.querySelector('.ls'), cerrar = () => ls.style.display = 'none';
    const mostrar = () => {
      const l = st.lineas[i], fs = FACTS[l.cod];
      if (!l.cod) { ls.innerHTML = '<div><small>Primero escoja el cliente</small></div>'; ls.style.display = 'block'; return; }
      if (!fs) { ls.innerHTML = '<div><small>Buscando facturas…</small></div>'; ls.style.display = 'block'; cargarFacturas(l.cod).then(() => { if (document.activeElement === inp) mostrar(); }); return; }
      const q = inp.value.trim().toUpperCase().replace(/\s+/g, ''), qd = q.replace(/\D/g, '');
      const le = letraDe(st), otras = fs.filter(f => !facDeLetra(f, le)).length;
      const ver = fs.filter(f => facDeLetra(f, le) && (!q || f.doc.indexOf(q) >= 0 || (qd && f.doc.replace(/\D/g, '').indexOf(qd) >= 0)));
      if (!ver.length) { ls.innerHTML = `<div><small>${fs.length - otras ? 'Ninguna coincide: siga escribiendo la factura a mano' : 'No hay facturas ' + le + ' recientes de este cliente: escríbala a mano'}${otras ? ' · ' + otras + ' factura(s) son de la otra letra (van en un informe ' + (le === 'G' ? 'N' : 'G') + ')' : ''}</small></div>`; ls.style.display = 'block'; return; }
      ls.innerHTML = ver.map(f => { const d = dias(f.fecha); return `<div data-j="${fs.indexOf(f)}"><b>${esc(f.doc)}</b> · ${$f(f.total)} <small>${esc(empLabel(f.emp))}</small><br><small>${fCorta(f.fecha)} · <span style="color:${d > 45 ? '#b42318' : 'inherit'}">${hace(d)}</span>${(f.notas || []).length ? ' · notas: ' + f.notas.map(n => esc(n.doc)).join(', ') : ''}</small>${f.abonado ? `<br><span class="ok">pagado ${$f(f.abonado)} · saldo ${$f(f.saldo)}</span>` : ''}</div>`; }).join('');
      ls.style.display = 'block';
      ls.querySelectorAll('[data-j]').forEach(d => d.addEventListener('mousedown', ev => { ev.preventDefault(); elegir(fs[+d.dataset.j]); }));
    };
    const elegir = f => {
      const l = st.lineas[i];
      const ns = f.notas || [], sN = ns.reduce((a, n) => a + n.sin, 0), tN = ns.reduce((a, n) => a + n.total, 0);
      const tot = f.total - tN, base = f.sin - sN;
      Object.assign(l, { factura: f.doc, facSistema: true, vf: String(tot), fsin: base, femp: f.emp, ftotal: tot, ratio: f.total ? f.sin / f.total : 0, base: '' });
      if (f.abonado && !l.tipo) l.tipo = 'Saldo';
      inp.value = f.doc; cerrar();
      if (chk(l, 'rf')) { l.rf = ''; sugerirRet(i, 'total'); }
      if (chk(l, 'ri')) { const r = reteIva(l, i); if (r) l.ri = String(r.sug); }
      pintarLinea(i); cambio();
      if (ns.length) aviso('Esta factura tiene ' + ns.length + ' nota' + (ns.length > 1 ? 's' : '') + ' (' + ns.map(n => n.doc).join(', ') + '): se propone el valor ' + $f(tot) + '.');
      if (f.pagos && f.pagos.length) aviso('Ojo: esta factura ya tiene pagos reportados (' + f.pagos.join(' · ') + ')', true);
    };
    inp.addEventListener('focus', mostrar);
    inp.addEventListener('input', () => { Object.assign(st.lineas[i], { factura: inp.value.toUpperCase(), facSistema: false, fsin: 0, femp: '', ftotal: 0, ratio: 0, saldo: '' }); mostrar(); refrescar(i); cambio(); });
    inp.addEventListener('blur', () => setTimeout(cerrar, 150));
  }

  /* ---------------- cerrar, ver, imprimir ---------------- */
  async function cerrar() {
    const lin = st.lineas.filter(usada);
    if (!lin.length) return aviso('Agregue al menos una factura', true);
    for (const l of lin) {
      const n = st.lineas.indexOf(l) + 1;
      if (l.anulado) { if (!digitos(l.recibo)) return aviso('Falta el número del recibo anulado en el pago ' + n, true); continue; }
      if (!digitos(l.recibo)) return aviso('Falta el número de recibo en el pago ' + n, true);
      if (!l.cod || !l.nombre) return aviso('Falta el cliente en el pago ' + n, true);
      if (!l.tipo) return aviso('Falta el tipo de pago en el pago ' + n, true);
      if (l.tipo === 'Abono' && vac(l.pag)) return aviso('Falta el valor pagado en el pago ' + n, true);
      if (!calc(l).cuadra) return aviso('El pago ' + n + ' no cuadra: revise descuento y valor pagado', true);
    }
    for (const k of recibosDe(lin.filter(l => !l.anulado))) {
      const c = cuadreRecibo(k);
      if (c.sinForma) return aviso('Falta la forma de pago en el recibo ' + k, true);
      if (!c.ok) return aviso('El recibo ' + k + ' no cuadra: facturas ' + $f(c.f) + ' y pagos ' + $f(c.p) + '. Revise las formas de pago.', true);
    }
    const ajenos = lin.filter(l => talDe(st.vendedor).libros.length && !libroDe(nRec(l.recibo), letraDe(st))).map(l => l.recibo);
    if (ajenos.length && !confirm('Estos recibos no están en sus talonarios ' + letraDe(st) + ': ' + ajenos.join(', ') + '. ¿Cerrar de todos modos?')) return;
    const malos = lin.map(l => st.lineas.indexOf(l)).filter(i => avisoRecibo(i));
    if (malos.length && !confirm('Los recibos de los pagos ' + malos.map(i => i + 1).join(', ') + ' no siguen el consecutivo. ¿Cerrar de todos modos?')) return;
    const t = sumas();
    if (!confirm(`¿Cerrar el informe?\n\nTotal recibo: ${$f(t.total)}\nEfectivo ${$f(t.ef)} · Cheques (${t.nch}) ${$f(t.ch)} · Transferencias (${t.ntr}) ${$f(t.tr)}${t.nco ? ' · Consignaciones (' + t.nco + ') ' + $f(t.co) : ''}\n\nPodrá modificarlo mientras cartera no lo reciba.`)) return;
    clearTimeout(timer);
    const b = document.getElementById('rc-cerrar'); b.disabled = true;
    try {
      const r = await api('recibo.cerrar', { inf: st, ver: st.ver });
      Object.assign(st, { estado: 'CERRADO', cierre: r.cierre, ver: r.ver, inicio: r.inicio });
      try { localStorage.removeItem(LSK()); } catch (e) {}
      aviso('✔ Informe cerrado'); pintar();
    } catch (e) { b.disabled = false; aviso(e.message === 'CAMBIO_EN_OTRO_EQUIPO' ? 'El informe se cambió en otro equipo: vuelva a abrirlo.' : 'No se pudo cerrar: ' + e.message, true); }
  }
  function imprimir() { let p = document.getElementById('rc-print'); if (!p) { p = document.createElement('div'); p.id = 'rc-print'; document.body.appendChild(p); } p.innerHTML = htmlInforme(); setTimeout(() => window.print(), 200); }
  function vistaPrevia() {
    let o = document.getElementById('rc-prev');
    if (!o) { o = document.createElement('div'); o.id = 'rc-prev'; document.body.appendChild(o); }
    o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;overflow:auto;padding:12px';
    o.innerHTML = `<div class="rc" style="max-width:1000px;margin:auto"><div class="card vista" style="margin:0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>Vista previa${st.estado === 'ABIERTO' || st.estado === 'NUEVO' ? ' (informe abierto)' : ''}</b><button class="q" id="rc-px" style="font-size:22px">✕</button></div>
      ${htmlInforme()}</div><div class="bt" style="background:transparent"><button class="b2" id="rc-pp">Imprimir</button><button class="b3" id="rc-pc">Cerrar vista previa</button></div></div>`;
    const fuera = () => o.remove();
    document.getElementById('rc-px').onclick = fuera; document.getElementById('rc-pc').onclick = fuera;
    document.getElementById('rc-pp').onclick = () => { fuera(); imprimir(); };
  }
  function pintarCerrado() {
    const rec = st.estado === 'RECIBIDO', n = nivelDe('recibo');
    document.getElementById('rc-cuerpo').innerHTML = `<div class="card">${rec
        ? `<b>✔ Recibido por cartera — en firme</b>${st.recibido ? ' · ' + esc(st.recibido) : ''}. Ya no se puede cambiar.`
        : `<b>Informe cerrado el ${esc(st.cierre)}.</b> Imprímalo y entréguelo en la empresa. Mientras cartera no lo reciba, puede modificarlo.`}</div>
      <div class="card vista">${htmlInforme()}</div>
      ${n >= 3 && U.elige ? '<button class="btn" id="rc-pend" style="width:100%;margin-bottom:10px">‹ Ver todos los por recibir</button>' : ''}
      <div class="bt">${!rec && n >= 2 && !state.verComo ? '<button class="b3" id="rc-mod">✏ Modificar</button>' : ''}
        ${U.impresora && n >= 2 ? '<button class="b1" id="rc-imp">🖨 Enviar a la impresora</button>' : ''}
        <button class="b2" id="rc-prn">Imprimir o guardar PDF</button>
        ${n >= 3 && !state.verComo ? (rec ? '<button class="b3" id="rc-dev">Devolver a cerrado</button>' : '<button class="bc" id="rc-rec">✔ Marcar recibido</button>') : ''}</div>`;
    const b = id => document.getElementById(id);
    if (b('rc-imp')) b('rc-imp').onclick = async () => { b('rc-imp').disabled = true; try { await api('recibo.imprimir', { id: st.id }); aviso('✔ Enviado a la impresora de la oficina'); } catch (e) { aviso(e.message, true); } b('rc-imp').disabled = false; };
    b('rc-prn').onclick = imprimir;
    if (b('rc-pend')) b('rc-pend').onclick = () => { VEND = ''; volverLista(); };
    const cambiar = async (accion, req, msg) => { try { const r = await api(accion, Object.assign({ id: st.id }, req)); cargar(VEND, r); aviso(msg); } catch (e) { aviso(e.message, true); } };
    if (b('rc-mod')) b('rc-mod').onclick = () => { if (confirm('¿Modificar este informe? Vuelve a quedar abierto; al terminar ciérrelo otra vez.')) cambiar('recibo.reabrir', {}, '✔ Informe abierto para modificar'); };
    if (b('rc-rec')) b('rc-rec').onclick = () => { if (confirm('¿Marcar como recibido por cartera? El vendedor ya no podrá cambiarlo.')) cambiar('recibo.recibir', { si: true }, '✔ Recibido: queda en firme'); };
    if (b('rc-dev')) b('rc-dev').onclick = () => { if (confirm('¿Devolverlo a cerrado? El vendedor podrá modificarlo otra vez.')) cambiar('recibo.recibir', { si: false }, '✔ Devuelto a cerrado'); };
  }
  function htmlInforme() { return mcInformeImpreso_(st, dv(), calc, usada); }   // st.pagos va dentro de st
})();

</script>
